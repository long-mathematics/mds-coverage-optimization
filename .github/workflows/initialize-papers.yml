name: Initial manuscript import
on:
  push:
    branches: [initial-two-paper-split]
    paths: [.github/workflows/initialize-papers.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: initial-two-paper-split
      - name: Reassemble and verify manuscript source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, os, pathlib, tarfile, urllib.request
          shas = [
            '7bcf8b82c99da75429be3a47d8d64b0907608d80',
            'c01204fce49f6b1de11ce7881c478bc7e5cca48b',
            '56c6ebf5ccacdbf2a15f2c3de45954002659d12e',
            'f7408cac88696e8cb8cc4172ca25385fa54d6555',
            '442cc69b84d10d92c5e13256078903cb72affbca',
            '0027ca7843f49179a7a91c96cae32a419c0a6640',
            '084ca269e6985df0353cdab11a2e4ecbb9863218',
            '7616b428a0c867a649bc6d0939e0433fbd9f8cd0',
            'c49bfc6097ace58955c508c71345853e156d715d',
            '8ff1ab03753f786497ef2112bbd143d7c7291663',
            '8919ead52c1d73d40e9370b8cec6d0857b16e75b',
            'a6533e4b348e2ae01e39a2bf434e5b05e593e6ea',
          ]
          parts = []
          for sha in shas:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  blob = json.load(response)
              assert blob['encoding'] == 'base64'
              raw = base64.b64decode(blob['content'])
              assert hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest() == sha
              parts.append(raw)
          payload = b''.join(parts)
          assert len(payload) == 71568
          assert hashlib.sha256(payload).hexdigest() == 'c352c58a0fb2683b53629815e36a4d2ac1f95a25a5bef2b9e829c69c9596b123'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(payload)), mode='r:') as archive:
              members = archive.getmembers()
              assert len(members) == 33
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute()
                  assert '..' not in path.parts and path.parts[0] not in ('.git', '.github')
                  target = pathlib.Path(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
          print('Verified and imported 33 source, audit, provenance, and build files.')
          PY
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Build and verify both papers
        run: |
          make pdf PYTHON=.venv/bin/python
          make test PYTHON=.venv/bin/python
          make check PYTHON=.venv/bin/python
      - name: Commit sources and matching compiled PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- . ':!.github'
          git commit -m 'feat: split v30 into standalone Gamma/MDS and terminal-cloud papers'
          git push origin HEAD:initial-two-paper-split
