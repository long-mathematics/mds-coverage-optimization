name: Prepare deep-audit clarity revisions
on:
  push:
    branches: [audit/deep-audit-clarifications]
    paths:
      - _apply_deep_audit_clarifications.py
      - _run_deep_audit_clarifications.py
      - .github/workflows/prepare-deep-audit-clarifications.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'long-mathematics/mds-coverage-optimization'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install repository build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Preserve baseline PDFs and apply audited clarifications
        run: |
          mkdir -p build/deep-audit-review/before build/deep-audit-review/after build/checks
          cp gamma_mds_active_uniform.pdf terminal_cloud_staircase.pdf build/deep-audit-review/before/
          .venv/bin/python _run_deep_audit_clarifications.py
          .venv/bin/python scripts/validate_repository.py --write-registry --sources-only
      - name: Run exact, symbolic, numerical, and source-regression checks
        run: |
          make test PYTHON=.venv/bin/python 2>&1 | tee build/deep-audit-review/make-test.log
      - name: Rebuild both manuscripts
        run: |
          make pdf PYTHON=.venv/bin/python 2>&1 | tee build/deep-audit-review/make-pdf.log
      - name: Run complete repository validation
        run: |
          make check PYTHON=.venv/bin/python 2>&1 | tee build/deep-audit-review/make-check.log
          git diff --check
      - name: Record validation and review artifact
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          root=Path('.')
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def pages(path):
              out=subprocess.check_output(['pdfinfo',str(path)],text=True)
              return int(next(line.split(':',1)[1] for line in out.splitlines() if line.startswith('Pages:')).strip())
          path=root/'docs/deep_audit_validation.json'
          data=json.loads(path.read_text())
          data.update({
              'status':'all standard checks passed on the clean GitHub runner',
              'commands_passed':['make test','make pdf','make check'],
              'source_and_pdf_records':[
                  {'source':'gamma_mds_active_uniform.tex','pdf':'gamma_mds_active_uniform.pdf','source_sha256':sha(root/'gamma_mds_active_uniform.tex'),'pdf_sha256':sha(root/'gamma_mds_active_uniform.pdf'),'pages':pages(root/'gamma_mds_active_uniform.pdf')},
                  {'source':'terminal_cloud_staircase.tex','pdf':'terminal_cloud_staircase.pdf','source_sha256':sha(root/'terminal_cloud_staircase.tex'),'pdf_sha256':sha(root/'terminal_cloud_staircase.pdf'),'pages':pages(root/'terminal_cloud_staircase.pdf')},
              ],
              'statement_registry_schema':2,
              'visual_review':'pending human affected-page review before merge',
              'proof_assistant_coverage':None,
          })
          path.write_text(json.dumps(data,indent=2)+'\n')
          PY
          cp gamma_mds_active_uniform.pdf terminal_cloud_staircase.pdf build/deep-audit-review/after/
          cp gamma_mds_active_uniform.tex terminal_cloud_staircase.tex build/deep-audit-review/after/
          pdfinfo gamma_mds_active_uniform.pdf > build/deep-audit-review/gamma-pdfinfo.txt
          pdfinfo terminal_cloud_staircase.pdf > build/deep-audit-review/cloud-pdfinfo.txt
          pdftotext gamma_mds_active_uniform.pdf build/deep-audit-review/gamma-after.txt
          pdftotext terminal_cloud_staircase.pdf build/deep-audit-review/cloud-after.txt
          git diff -- . ':!*.pdf' > build/deep-audit-review/reviewed-text.patch
      - name: Upload before-and-after review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-audit-clarity-review
          path: build/deep-audit-review
          if-no-files-found: error
          retention-days: 14
      - name: Commit the validated manuscript revisions
        run: |
          git add README.md THEOREM_STATUS.md FORMALIZATION_STATUS.md FORMALIZATION_AUDIT.md
          git add docs/DEEP_AUDIT_CLARIFICATIONS.md docs/INTEGRATION_AUDIT.md docs/PROOF_DEPENDENCIES.md
          git add docs/deep_audit_validation.json docs/pdf_manifest.json docs/statement_registry.json
          git add gamma_mds_active_uniform.tex gamma_mds_active_uniform.pdf
          git add terminal_cloud_staircase.tex terminal_cloud_staircase.pdf
          git add scripts/test_audit_regressions.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply deep-audit clarity revisions to both papers'
          git push origin HEAD:audit/deep-audit-clarifications
