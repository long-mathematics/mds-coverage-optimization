name: Prepare localized first-audit corrections
on:
  push:
    branches: [fix/first-audit-local-corrections]
    paths:
      - _prepare_first_audit.py
      - .github/workflows/prepare-first-audit.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'long-mathematics/mds-coverage-optimization'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install the repository build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Apply the locally tested corrections and refresh registry
        run: |
          .venv/bin/python _prepare_first_audit.py
          .venv/bin/python scripts/validate_repository.py --write-registry --sources-only
      - name: Tests, matching PDF builds, and repository checks
        run: |
          make test PYTHON=.venv/bin/python
          make pdf PYTHON=.venv/bin/python
          make check PYTHON=.venv/bin/python
          git diff --check
      - name: Commit only the intended corrections on this feature branch
        run: |
          git add AGENTS.md FORMALIZATION_STATUS.md Makefile README.md THEOREM_STATUS.md
          git add docs/FIRST_AUDIT_CORRECTIONS.md docs/INTEGRATION_AUDIT.md docs/VISUAL_REVIEW.md
          git add docs/pdf_manifest.json docs/statement_registry.json
          git add gamma_mds_active_uniform.tex gamma_mds_active_uniform.pdf
          git add terminal_cloud_staircase.tex terminal_cloud_staircase.pdf
          git add scripts/validate_repository.py scripts/test_audit_regressions.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply localized first-audit corrections and rebuild both manuscripts'
          git push origin HEAD:fix/first-audit-local-corrections
          git rev-parse HEAD
